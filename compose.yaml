services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nidavelir
      POSTGRES_USER: nidavelir
      POSTGRES_PASSWORD: nidavelir
    volumes:
      - nidavelir-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nidavelir -d nidavelir"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker-image:
    build:
      context: ./worker
    image: nidavelir-worker:dev
    command: ["true"]
    restart: "no"

  core:
    build:
      context: ./core
    environment:
      NIDAVELIR_DATABASE_URL: postgresql+psycopg://nidavelir:nidavelir@postgres:5432/nidavelir
      NIDAVELIR_ENV: development
      NIDAVELIR_LOG_LEVEL: INFO
      NIDAVELIR_WORKER_IMAGE: nidavelir-worker:dev
      NIDAVELIR_GITHUB_TOKEN: ${NIDAVELIR_GITHUB_TOKEN:-}
      NIDAVELIR_OPENAI_API_KEY: ${NIDAVELIR_OPENAI_API_KEY:-}
      NIDAVELIR_CURSOR_API_KEY: ${NIDAVELIR_CURSOR_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      worker-image:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  mcp:
    build:
      context: ./mcp
    environment:
      NIDAVELIR_MCP_CORE_URL: http://core:8000
      NIDAVELIR_MCP_TRANSPORT: streamable-http
      NIDAVELIR_MCP_HOST: 0.0.0.0
      NIDAVELIR_MCP_PORT: 8001
      NIDAVELIR_MCP_AUTH_TOKEN: ${NIDAVELIR_MCP_AUTH_TOKEN:-nidavelir-development-token}
      NIDAVELIR_MCP_RESOURCE_URL: ${NIDAVELIR_MCP_RESOURCE_URL:-http://127.0.0.1:8001/mcp}
      NIDAVELIR_MCP_ISSUER_URL: ${NIDAVELIR_MCP_ISSUER_URL:-http://127.0.0.1:8001}
    depends_on:
      - core
    ports:
      - "8001:8001"
    restart: unless-stopped

  web:
    build:
      context: ./web
    depends_on:
      - core
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  nidavelir-postgres:
