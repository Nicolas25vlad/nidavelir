<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nidavelir</title>
  <desc id="desc">Nidavelir wordmark with a forge-star symbol.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0F19"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="metal" x1="85" y1="76" x2="236" y2="233" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EDF2FA"/>
      <stop offset="0.55" stop-color="#BAC5D8"/>
      <stop offset="1" stop-color="#738099"/>
    </linearGradient>
    <radialGradient id="ember" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 160) rotate(90) scale(48)">
      <stop stop-color="#FFF4CE"/>
      <stop offset="0.38" stop-color="#FFC76A"/>
      <stop offset="0.72" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#FF5B00"/>
    </radialGradient>
    <filter id="glow" x="95" y="95" width="130" height="130" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>

  <circle cx="160" cy="160" r="98" stroke="#253043" stroke-width="10"/>
  <circle cx="160" cy="160" r="76" stroke="#20293A" stroke-width="2" stroke-dasharray="3 9"/>

  <g>
    <path d="M160 70L179 121L230 140L179 159L160 210L141 159L90 140L141 121L160 70Z" fill="url(#metal)" opacity="0.95"/>
    <path d="M160 84L175 124L215 139L175 154L160 194L145 154L105 139L145 124L160 84Z" fill="#DDE5F3" opacity="0.2"/>
    <path d="M160 102L171 131L200 142L171 153L160 182L149 153L120 142L149 131L160 102Z" fill="url(#ember)" filter="url(#glow)"/>
    <circle cx="160" cy="142" r="4" fill="#FFF4CE" opacity="0.9"/>
    <circle cx="160" cy="160" r="7" fill="#FFF8E2"/>
  </g>

  <g fill="#FFB347" opacity="0.95">
    <rect x="244" y="103" width="6" height="6" rx="2" transform="rotate(15 244 103)"/>
    <rect x="257" y="120" width="4" height="4" rx="1.5" transform="rotate(28 257 120)"/>
    <rect x="77" y="214" width="5" height="5" rx="1.5" transform="rotate(-20 77 214)"/>
  </g>

  <text x="320" y="188" fill="#F4F7FB" font-size="92" font-weight="700" letter-spacing="2.5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">NIDAVELIR</text>
  <text x="322" y="223" fill="#94A3B8" font-size="20" font-weight="500" letter-spacing="4.2" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">MCP-NATIVE AUTONOMOUS DEV ORCHESTRATION</text>
</svg>
