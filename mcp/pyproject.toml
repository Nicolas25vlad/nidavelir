[project]
name = "nidavelir-mcp"
version = "0.1.0"
description = "MCP control surface for Nidavelir"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1.0",
  "mcp>=2,<3",
  "pydantic-settings>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[project.scripts]
nidavelir-mcp = "nidavelir_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nidavelir_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
