name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Build Core image
        run: docker build -t nidavelir-core:ci .

  mcp:
    name: MCP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp/pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Build MCP image
        run: docker build -t nidavelir-mcp:ci .

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Build Web image
        run: docker build -t nidavelir-web:ci .

  worker:
    name: Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate worker scripts
        run: bash -n worker/*.sh

      - name: Build worker image
        run: docker build -t nidavelir-worker:ci worker/

      - name: Verify non-root runtime
        run: |
          uid="$(docker run --rm --entrypoint id nidavelir-worker:ci -u)"
          test "$uid" = "10001"

      - name: Smoke test Codex CLI
        run: docker run --rm nidavelir-worker:ci codex --version

      - name: Smoke test Cursor Agent CLI
        run: docker run --rm nidavelir-worker:ci agent --version

      - name: Verify worker helpers exist
        run: |
          docker run --rm --entrypoint test nidavelir-worker:ci -x /usr/local/bin/nidavelir-prepare
          docker run --rm --entrypoint test nidavelir-worker:ci -x /usr/local/bin/nidavelir-run-task
          docker run --rm --entrypoint test nidavelir-worker:ci -x /usr/local/bin/nidavelir-push
          docker run --rm --entrypoint test nidavelir-worker:ci -x /usr/local/bin/nidavelir-capture-diff
          docker run --rm --entrypoint test nidavelir-worker:ci -x /usr/local/bin/nidavelir-run-check

  compose:
    name: Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate development compose
        run: docker compose config --quiet

      - name: Validate deployment scripts
        run: bash -n deploy/install.sh deploy/nidavelir

      - name: Validate production compose
        env:
          NIDAVELIR_INSTALLATION_ID: ci-installation
          NIDAVELIR_COMPOSE_PROJECT_NAME: nidavelir-ci
          NIDAVELIR_POSTGRES_PASSWORD: test-password
          NIDAVELIR_DATABASE_URL: postgresql+psycopg://nidavelir:test-password@postgres:5432/nidavelir
          NIDAVELIR_GITHUB_TOKEN: test-token
          NIDAVELIR_OPENAI_API_KEY: test-key
          NIDAVELIR_MCP_AUTH_TOKEN: test-mcp-token-that-is-long-enough-for-ci
        run: docker compose -f deploy/compose.prod.yaml config --quiet

  required:
    name: CI / required
    if: always()
    needs: [core, mcp, web, worker, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all CI jobs
        env:
          CORE_RESULT: ${{ needs.core.result }}
          MCP_RESULT: ${{ needs.mcp.result }}
          WEB_RESULT: ${{ needs.web.result }}
          WORKER_RESULT: ${{ needs.worker.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
        run: |
          printf 'Core: %s\nMCP: %s\nWeb: %s\nWorker: %s\nCompose: %s\n' \
            "$CORE_RESULT" "$MCP_RESULT" "$WEB_RESULT" "$WORKER_RESULT" "$COMPOSE_RESULT"

          test "$CORE_RESULT" = "success"
          test "$MCP_RESULT" = "success"
          test "$WEB_RESULT" = "success"
          test "$WORKER_RESULT" = "success"
          test "$COMPOSE_RESULT" = "success"
