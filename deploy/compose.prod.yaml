name: ${NIDAVELIR_COMPOSE_PROJECT_NAME:-nidavelir}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nidavelir
      POSTGRES_USER: nidavelir
      POSTGRES_PASSWORD: ${NIDAVELIR_POSTGRES_PASSWORD:?set NIDAVELIR_POSTGRES_PASSWORD}
    volumes:
      - nidavelir-postgres:/var/lib/postgresql/data
    networks:
      - data
    cpus: ${NIDAVELIR_POSTGRES_CPUS:-0.50}
    mem_limit: ${NIDAVELIR_POSTGRES_MEMORY:-512m}
    pids_limit: ${NIDAVELIR_POSTGRES_PIDS_LIMIT:-128}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nidavelir -d nidavelir"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker-image:
    image: ghcr.io/nicolas25vlad/nidavelir-worker:${NIDAVELIR_VERSION:-latest}
    command: ["true"]
    network_mode: none
    restart: "no"

  core:
    image: ghcr.io/nicolas25vlad/nidavelir-core:${NIDAVELIR_VERSION:-latest}
    environment:
      NIDAVELIR_DATABASE_URL: ${NIDAVELIR_DATABASE_URL:?set NIDAVELIR_DATABASE_URL}
      NIDAVELIR_ENV: production
      NIDAVELIR_INSTALLATION_ID: ${NIDAVELIR_INSTALLATION_ID:?set NIDAVELIR_INSTALLATION_ID}
      NIDAVELIR_LOG_LEVEL: ${NIDAVELIR_LOG_LEVEL:-INFO}
      NIDAVELIR_MAX_PARALLEL_WORKERS: ${NIDAVELIR_MAX_PARALLEL_WORKERS:-2}
      NIDAVELIR_WORKER_IMAGE: ghcr.io/nicolas25vlad/nidavelir-worker:${NIDAVELIR_VERSION:-latest}
      NIDAVELIR_WORKER_CPUS: ${NIDAVELIR_WORKER_CPUS:-1.0}
      NIDAVELIR_WORKER_MEMORY: ${NIDAVELIR_WORKER_MEMORY:-2g}
      NIDAVELIR_WORKER_TIMEOUT_SECONDS: ${NIDAVELIR_WORKER_TIMEOUT_SECONDS:-1800}
      NIDAVELIR_WORKER_STOP_TIMEOUT_SECONDS: ${NIDAVELIR_WORKER_STOP_TIMEOUT_SECONDS:-10}
      NIDAVELIR_GITHUB_TOKEN: ${NIDAVELIR_GITHUB_TOKEN:-}
      NIDAVELIR_OPENAI_API_KEY: ${NIDAVELIR_OPENAI_API_KEY:-}
      NIDAVELIR_CURSOR_API_KEY: ${NIDAVELIR_CURSOR_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      worker-image:
        condition: service_completed_successfully
    volumes:
      - ${NIDAVELIR_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      - data
      - control
    cpus: ${NIDAVELIR_CORE_CPUS:-0.75}
    mem_limit: ${NIDAVELIR_CORE_MEMORY:-512m}
    pids_limit: ${NIDAVELIR_CORE_PIDS_LIMIT:-256}
    restart: unless-stopped

  mcp:
    image: ghcr.io/nicolas25vlad/nidavelir-mcp:${NIDAVELIR_VERSION:-latest}
    environment:
      NIDAVELIR_MCP_CORE_URL: http://core:8000
      NIDAVELIR_MCP_TRANSPORT: streamable-http
      NIDAVELIR_MCP_HOST: 0.0.0.0
      NIDAVELIR_MCP_PORT: 8001
      NIDAVELIR_MCP_AUTH_TOKEN: ${NIDAVELIR_MCP_AUTH_TOKEN:?set NIDAVELIR_MCP_AUTH_TOKEN}
      NIDAVELIR_MCP_RESOURCE_URL: ${NIDAVELIR_MCP_RESOURCE_URL:-http://127.0.0.1:8001/mcp}
      NIDAVELIR_MCP_ISSUER_URL: ${NIDAVELIR_MCP_ISSUER_URL:-http://127.0.0.1:8001}
    depends_on:
      - core
    ports:
      - "${NIDAVELIR_MCP_BIND_ADDRESS:-127.0.0.1}:${NIDAVELIR_MCP_HOST_PORT:-8001}:8001"
    networks:
      - control
    cpus: ${NIDAVELIR_MCP_CPUS:-0.25}
    mem_limit: ${NIDAVELIR_MCP_MEMORY:-256m}
    pids_limit: ${NIDAVELIR_MCP_PIDS_LIMIT:-128}
    restart: unless-stopped

  web:
    image: ghcr.io/nicolas25vlad/nidavelir-web:${NIDAVELIR_VERSION:-latest}
    depends_on:
      - core
    ports:
      - "${NIDAVELIR_WEB_BIND_ADDRESS:-127.0.0.1}:${NIDAVELIR_WEB_HOST_PORT:-8080}:80"
    networks:
      - control
    cpus: ${NIDAVELIR_WEB_CPUS:-0.25}
    mem_limit: ${NIDAVELIR_WEB_MEMORY:-128m}
    pids_limit: ${NIDAVELIR_WEB_PIDS_LIMIT:-64}
    restart: unless-stopped

volumes:
  nidavelir-postgres:

networks:
  data:
    internal: true
  control:
